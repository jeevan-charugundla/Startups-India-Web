name: Deploy Backend (EC2)

# Auto-deploys the backend to EC2 on every push to main - but ONLY when
# something under backend/ (or this workflow) changed. Frontend pushes are
# ignored (Vercel handles the frontend).
#
# How auth works (private repo, no key on the server):
#   - The runner checks out the repo using GitHub's built-in token (auto).
#   - It ships ONLY the backend/ folder to EC2 over rsync, using the EC2 SSH key.
#   - EC2 never authenticates to GitHub - so no deploy key needed there.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Ship backend to EC2 + reload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Private repo: explicitly grant the built-in token read access so checkout
    # can clone it (orgs often default this to "no permissions", → 403).
    permissions:
      contents: read
    steps:
      - name: Checkout repo (auto-authed for private repo)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load EC2 SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync backend/ to EC2 (preserves .env & node_modules)
        run: |
          rsync -az --delete \
            --exclude='.env' --exclude='.env.*' --exclude='node_modules' --exclude='logs' \
            -e "ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new" \
            backend/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/learning-startups-india/backend/"

      - name: Install deps + zero-downtime reload (with auto-rollback)
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' <<'REMOTE'
            set -eo pipefail
            export PATH="$PATH:/usr/bin:/usr/local/bin:$HOME/.local/share/pnpm:$HOME/.npm-global/bin"
            cd ~/learning-startups-india/backend

            # ── PRE-DEPLOY BACKUP ─────────────────────────────────────
            # Snapshot the current working src/ so we can auto-rollback
            BACKUP_DIR="$HOME/.deploy-backups/$(date +%Y%m%d_%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            cp -r src/ "$BACKUP_DIR/src/"
            cp package.json pnpm-lock.yaml ecosystem.config.js "$BACKUP_DIR/" 2>/dev/null || true
            echo "▸ Backup saved to $BACKUP_DIR"

            # Keep only the last 5 backups to save disk space
            ls -dt $HOME/.deploy-backups/*/ 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true

            # ── INSTALL & RELOAD ──────────────────────────────────────
            echo "▸ Installing backend deps (pnpm, prod, frozen)…"
            pnpm install --prod --frozen-lockfile

            echo "▸ Reload (ecosystem, production env)…"
            PM2_INSTANCES=1 pm2 reload ecosystem.config.js --env production \
              || PM2_INSTANCES=1 pm2 start ecosystem.config.js --env production
            pm2 save

            # ── HEALTH CHECK WITH RETRIES ─────────────────────────────
            echo "▸ Health check (up to ~45s)…"
            ok=false
            for i in $(seq 1 15); do
              if curl -sf http://localhost:5000/health >/dev/null; then ok=true; break; fi
              sleep 3
            done

            if [ "$ok" = true ]; then
              echo "✓ Backend deployed and healthy"
            else
              # ── AUTO-ROLLBACK ─────────────────────────────────────
              echo "✗ Health check FAILED - rolling back to previous version…"
              pm2 logs --nostream --lines 50 || true

              # Restore the backup
              cp -r "$BACKUP_DIR/src/" src/
              cp "$BACKUP_DIR/package.json" "$BACKUP_DIR/pnpm-lock.yaml" . 2>/dev/null || true
              pnpm install --prod --frozen-lockfile 2>/dev/null || true

              # Restart with the old code
              pm2 delete all 2>/dev/null || true
              PM2_INSTANCES=1 pm2 start ecosystem.config.js --env production
              pm2 save

              # Verify rollback worked
              sleep 10
              if curl -sf http://localhost:5000/health >/dev/null; then
                echo "⚠ ROLLBACK SUCCESSFUL - server restored to previous version"
              else
                echo "💥 ROLLBACK ALSO FAILED - manual intervention needed!"
              fi
              exit 1
            fi
          REMOTE

