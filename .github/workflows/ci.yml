name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Job 1: Code Quality ──────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: ESLint
        run: pnpm run lint
        working-directory: frontend

      - name: Prettier check
        run: pnpm run format:check
        working-directory: frontend

      - name: Audit (frontend)
        run: pnpm audit --audit-level high
        working-directory: frontend
        continue-on-error: true

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ── Job 2: Tests ─────────────────────────────────────────────
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run tests
        run: pnpm run test:ci
        working-directory: frontend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.node-version == '20'
        continue-on-error: true
        with:
          directory: frontend/coverage

  # ── Job 3: Build ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [code-quality, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build Next.js
        run: pnpm run build
        working-directory: frontend
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: frontend/.next
          retention-days: 7

  # ── Job 4: Security ──────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Snyk scan (frontend)
        run: npx snyk test --severity-threshold=high
        continue-on-error: true
        working-directory: frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk scan (backend)
        run: npx snyk test --severity-threshold=high
        continue-on-error: true
        working-directory: backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ── Job 5: Backend Safety Checks ──────────────────────────────
  backend-safety:
    name: Backend Safety (Case + Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      # Catches Windows→Linux case-sensitivity bugs (e.g. ApiError vs apiError)
      # that work on Windows but crash on EC2 (Linux).
      - name: Check case-sensitive imports
        run: node ../scripts/check-case-imports.js
        working-directory: backend

      # Verify the server can actually start (catches missing modules, syntax
      # errors, broken requires). Starts the server, waits for health check,
      # then shuts down.
      - name: Boot test (verify server starts)
        run: |
          # Create a minimal .env for the boot test
          cat > .env <<EOF
          PORT=5000
          NODE_ENV=production
          MONGODB_URI=mongodb://localhost:27017/test
          JWT_ACCESS_SECRET=ci-test-secret-key-not-real
          JWT_REFRESH_SECRET=ci-test-refresh-key-not-real
          JWT_ACCESS_EXPIRES_IN=2h
          JWT_REFRESH_EXPIRES_IN=30d
          CORS_ORIGIN=http://localhost:3000
          REDIS_URL=redis://localhost:6379
          ADMIN_EMAIL=test@test.com
          ADMIN_PASSWORD=Test@12345
          ADMIN_SLUG=test-panel
          SMS_PROVIDER=console
          OTP_PEPPER=test-pepper
          FRONTEND_URL=http://localhost:3000
          EOF

          # Try to require all route files (catches import errors without needing
          # MongoDB/Redis). This is the same check Node does at startup.
          node -e "
            try {
              // Simulate the require chain that server.js does
              require('./src/config/env');
              require('./src/app');
              console.log('✅ All modules loaded successfully');
              process.exit(0);
            } catch (err) {
              console.error('❌ Module load FAILED:', err.message);
              console.error(err.stack);
              process.exit(1);
            }
          " || {
            echo "💥 Backend boot test FAILED - this deploy would crash EC2!"
            exit 1
          }
        working-directory: backend

